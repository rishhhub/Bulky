spring:
  application:
    name: BulkBy
  
  datasource:
    url: jdbc:h2:mem:bulkby
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-to-a-very-long-random-string}
  expiration: 86400000 # 24 hours in milliseconds

payment:
  gateway:
    enabled: false # Set to true when payment gateway is configured
    provider: mock # mock, stripe, paypal, etc.

logistics:
  weight-multiplier: 2.5 # Cost per kg/lb for delivery calculation

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
