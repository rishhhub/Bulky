spring:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.bulkby: INFO
    org.springframework: WARN

# Production: JWT secret must be set via JWT_SECRET env (no default). Validated at startup by JwtSecretValidator.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS: set allowed origins to your actual front-end URLs (comma-separated or env CORS_ALLOWED_ORIGINS).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    hsts-enabled: true
