POSTGRES_USER: postgres
POSTGRES_PASSWORD: 12345678

spring:
  application:
    name: BulkBy
  profiles:
    default: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bulkby}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false
    locations: classpath:db/migration/app
  jackson:
    serialization:
      write-dates-as-timestamps: false
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      database: 0

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-to-a-very-long-random-string}
  expiration: 86400000 # 24 hours in milliseconds

payment:
  gateway:
    enabled: false # Set to true when payment gateway is configured
    provider: mock # mock, stripe, paypal, etc.

logistics:
  weight-multiplier: 2.5 # Cost per kg/lb for delivery calculation

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# File storage: local (default) or s3. For S3 set file.storage-type=s3 and file.s3.* properties.
file:
  storage-type: local
  upload-dir: uploads
  # S3 (when storage-type=s3): bucket, region, optional endpoint-override (MinIO), access-key, secret-key, public-base-url
  # s3:
  #   bucket: bulkby-uploads
  #   region: us-east-1
  #   endpoint-override: https://minio.example.com
  #   access-key: ${AWS_ACCESS_KEY_ID:}
  #   secret-key: ${AWS_SECRET_ACCESS_KEY:}
  #   public-base-url: https://cdn.example.com

# CORS: allowed origins (comma-separated or list in YAML). Production should override with actual front-end origins.
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173
  security:
    hsts-enabled: false
