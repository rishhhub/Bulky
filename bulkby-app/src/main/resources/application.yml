spring:
  application:
    name: BulkBy
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkby}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      database: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 10000
  servlet:
    context-path: /api
  tomcat:
    max-threads: 10
    min-spare-threads: 2
    accept-count: 10
  compression:
    enabled: true
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET:qsdfvbnmhgfdggdgytdfhghfdfghgrfdgghdfdgghdffplokijhgedfghjkkjhgfghjkjhghjkmjhgbhjjhgfiuhgtfuiytgfgggvbnujhghjhghbg}
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

file:
  storage-type: local
  upload-dir: uploads

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bulky-user.vercel.app}
  security:
    hsts-enabled: true

management:
  server:
    port: 10000
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
