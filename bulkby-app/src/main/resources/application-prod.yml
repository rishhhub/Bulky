# Production profile: loaded when spring.profiles.active=prod
spring:
  config:
    activate:
      on-profile: prod
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false  # Disable lazy loading in views to reduce memory
    properties:
      hibernate.jdbc.batch_size: 20
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkby}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # Reduced from 20 to save memory
      minimum-idle: 2       # Reduced from 5 to save memory
      connection-timeout: 20000
      idle-timeout: 300000
      leak-detection-threshold: 60000
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    org.bulkby: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# JWT: must be set via JWT_SECRET env. Validated at startup by JwtSecretValidator.
jwt:
  secret: ${JWT_SECRET:change-me-to-a-real-secret}
  expiration: 86400000

# CORS: set CORS_ALLOWED_ORIGINS to your front-end URLs (comma-separated).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    hsts-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info  # Only expose essential endpoints
  endpoint:
    health:
      show-details: when-authorized
