# Production profile: loaded when spring.profiles.active=prod
spring:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # Use validate in prod. For fresh DB, set DDL_AUTO=update once then switch to validate.
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkby}
    username: ${SPRING_DATASOURCE_USERNAME:bulkby}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    org.bulkby: INFO
    org.springframework: WARN

# JWT: must be set via JWT_SECRET env. Validated at startup by JwtSecretValidator.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS: set CORS_ALLOWED_ORIGINS to your front-end URLs (comma-separated).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    hsts-enabled: true
