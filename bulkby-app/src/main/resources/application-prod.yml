# Production profile: loaded when spring.profiles.active=prod
spring:
  config:
    activate:
      on-profile: prod
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 20
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkby}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  tomcat:
    max-threads: 10
    min-spare-threads: 2
    accept-count: 10
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    org.bulkby: INFO
    org.springframework: WARN
    org.hibernate: ERROR
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"

# JWT: must be set via JWT_SECRET env.
jwt:
  secret: ${JWT_SECRET:change-me-to-a-real-secret}
  expiration: 86400000

# CORS
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    hsts-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      jvm: false
