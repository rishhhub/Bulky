# Production profile: loaded when spring.profiles.active=prod
spring:
  config:
    activate:
      on-profile: prod
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkby}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

server:
  port: ${PORT:8080}

logging:
  level:
    org.bulkby: INFO
    org.springframework: WARN

# JWT: must be set via JWT_SECRET env. Validated at startup by JwtSecretValidator.
jwt:
  secret: ${JWT_SECRET:change-me-to-a-real-secret}
  expiration: 86400000

# CORS: set CORS_ALLOWED_ORIGINS to your front-end URLs (comma-separated).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    hsts-enabled: true
